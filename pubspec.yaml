name: vet_manager_mobile
description: Enterprise Clinical Veterinary Mobile Client
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI Design, Typography & Micro-Animations
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  animations: ^2.0.11
  flutter_svg: ^2.0.10+1

  # State Management & DI
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  get_it: ^7.7.0
  injectable: ^2.4.2

  # Routing
  go_router: ^14.2.7

  # Networking & Serialization
  dio: ^5.7.0
  json_annotation: ^4.9.0
  connectivity_plus: ^6.0.5

  # Local Persistence & Relational Schema (Drift)
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24 # 16KB Android 15 page size compatible
  path_provider: ^2.1.4
  path: ^1.9.0

  # Hardware Security & Biometrics
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.2.0

  # Identifiers & Arithmetic
  uuid: ^4.5.1 # RFC 9562 UUID v7
  decimal: ^3.0.2 # High precision stock & dosage math
  intl: ">=0.19.0 <0.21.0"

  # Media, Camera & Documents
  image_picker: ^1.1.2 # Complies with Google Photo Picker (Zero broad storage permission)
  flutter_image_compress: ^2.3.0 # Client-side WebP compression
  photo_view: ^0.15.0 # High-resolution radiograph zoom
  cached_network_image: ^3.4.0
  printing: ^5.13.2 # Native PDF case study rendering & export
  pdf: ^3.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  json_serializable: ^6.8.0
  injectable_generator: ^2.6.1
  drift_dev: ^2.20.0
  sqlite3: ^2.4.6
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - google_fonts/
